<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vỉa Hè Sài Gòn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 2D side-scrolling street (canvas); HUD top; ◀ ▶ pad left, action button right, stock tray center; bottom sheets for every menu. */
:root{
  --bg:#f5dfb3; --ink:#2a1a10; --paper:#fff7e6; --paper-2:#f6e7c8; --line:#e0c28f;
  --accent:#e2471e; --accent-ink:#fff7e6; --gold:#f2b632; --good:#27925a; --bad:#c23a1c; --blue:#2f7fc9; --muted:#8c6b48;
  --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif;
  --sh:0 4px 0 var(--ink); color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:absolute;inset:0;display:block;width:100%;height:100%}
button{font:inherit;font-weight:700;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:var(--sh);transition:translate .06s,box-shadow .06s;touch-action:manipulation}
button:active{translate:0 4px;box-shadow:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;pointer-events:none}
button.pri{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:19px;padding:13px 16px;width:100%}
button.gold{background:var(--gold);color:var(--ink)} button.good{background:var(--good);color:var(--accent-ink)} button.blue{background:var(--blue);color:var(--accent-ink)}
button.sm{padding:6px 12px;border-radius:10px;min-width:42px;font-size:15px}

#combo{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));translate:-50% 0;display:none;align-items:center;gap:8px;background:linear-gradient(#ff9a3c,#e2471e);color:#fff7e6;border:3px solid var(--ink);border-radius:999px;padding:3px 14px 7px;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;pointer-events:none;z-index:3;position:absolute;overflow:hidden}
#combo.on{display:flex}#combo b{font-size:20px;line-height:1}#combo small{font-size:11px;opacity:.9;letter-spacing:.04em}
#combo i{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.35)}#combo u{display:block;height:100%;background:#ffe27a;width:100%}
#combo.pop{animation:cpop .25s}@keyframes cpop{50%{transform:scale(1.18)}}
.chip.goal{min-width:96px}.chip.goal .bar{width:100%;height:8px}.chip.goal .bar i{background:linear-gradient(90deg,#ffb92e,#e2471e)}.chip.goal.done .bar i{background:var(--good)}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;gap:6px;align-items:flex-start;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2;flex-wrap:wrap}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:4px 9px;box-shadow:var(--sh);display:flex;flex-direction:column;line-height:1.1;min-width:0}
.chip small{font-weight:700;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.chip b{font-family:var(--display);font-weight:800;font-size:16px;white-space:nowrap}
.chip.cash b{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.bar.sta i{background:var(--blue)}
#menuBtn{pointer-events:auto;margin-left:auto;font-size:22px;padding:4px 12px;border-radius:16px}
#hud.bump .cash{animation:bump .3s}
@keyframes bump{40%{scale:1.08}}
#dist{opacity:0;transition:opacity .6s;position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;font-family:var(--display);font-weight:800;font-size:14px;color:#fff7e6;text-shadow:0 2px 0 rgba(42,26,16,.8),0 0 6px rgba(42,26,16,.6);pointer-events:none;z-index:2;white-space:nowrap}

#pad{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;z-index:3}
#pad button{width:78px;height:78px;border-radius:50%;font-size:34px;padding:0;background:var(--paper);display:grid;place-items:center;touch-action:none}
#pad button.dn{translate:0 4px;box-shadow:none;background:var(--gold)}
.ic{width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain;display:inline-block}
.chip img{width:22px;height:22px;object-fit:contain;margin-right:4px;vertical-align:-5px}
.card .n .ic{width:34px;height:34px}
#turn{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:6;background:var(--ink);color:var(--paper);border-radius:18px;padding:14px 18px;font-weight:700;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3);max-width:80vw}
#turn[hidden]{display:none}
#act{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;z-index:3;font-family:var(--display);font-weight:800;font-size:12px;line-height:1.1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--gold)}
#act span{font-size:30px}
#prem{position:absolute;right:126px;bottom:calc(100px + env(safe-area-inset-bottom,0px));padding:6px 12px;border-radius:14px;font-size:13px;z-index:3;background:var(--blue);color:var(--accent-ink)}
#prem[hidden]{display:none}
#ride{position:absolute;right:126px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;z-index:3;font-family:var(--display);font-weight:800;font-size:11px;line-height:1.1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--blue);color:var(--accent-ink)}
#ride span{font-size:22px} #ride.on{background:var(--accent)}
#act.open{background:var(--accent);color:var(--accent-ink)} #act.shop{background:var(--good);color:var(--accent-ink)} #act.cafe{background:var(--blue);color:var(--accent-ink)} #act.home{background:var(--paper)}
#tray{position:absolute;left:50%;translate:-50% 0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;pointer-events:none;z-index:2;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 260px)}
.tr{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:3px 7px;box-shadow:var(--sh);display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tr span{font-size:18px}
.tr.empty{opacity:.45} .tr.low b{color:var(--bad)}
.play{transition:opacity .3s}
.play[hidden]{display:block!important;opacity:0;pointer-events:none}
#tray[hidden]{display:flex!important;opacity:0;pointer-events:none}
#kbd{position:absolute;left:50%;translate:-50% 0;top:calc(88px + env(safe-area-inset-top,0px));font-size:12px;color:#fff7e6;text-shadow:0 1px 3px rgba(0,0,0,.7);font-weight:700;pointer-events:none;z-index:2;display:none}
#kbd.on{display:block;animation:kfade 9s forwards}@keyframes kfade{0%,75%{opacity:1}100%{opacity:0}}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.bub{position:absolute;translate:-50% -100%;pointer-events:auto;cursor:pointer;width:56px;height:56px;display:grid;place-items:center;font-size:26px;line-height:1;filter:drop-shadow(0 3px 0 var(--ink))}
.bub svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg}
.bub svg .bg{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.bub svg .ring{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:0}
.bub.hurry svg .ring{stroke:var(--bad)}
.bub.hurry{animation:wob .3s infinite alternate}
.bub em{position:relative;font-style:normal;margin-top:-2px}
.bub em b{position:absolute;right:-14px;top:-8px;font-size:11px;font-family:var(--display);background:var(--accent);color:var(--paper);border-radius:8px;padding:1px 4px;border:1.5px solid var(--ink)}
.bub .nm{position:absolute;top:100%;left:50%;translate:-50% 2px;font-style:normal;font-size:10px;font-weight:700;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:1px 6px;white-space:nowrap}
.bub:active{scale:.9}
@keyframes wob{from{rotate:-6deg}to{rotate:6deg}}
.fly{position:absolute;translate:-50% -50%;font-family:var(--display);font-weight:800;font-size:21px;pointer-events:none;animation:up 1.1s forwards;-webkit-text-stroke:1px var(--ink);white-space:nowrap}
.fly.good{color:var(--gold)} .fly.bad{color:var(--paper)}
@keyframes up{to{translate:-50% -110px;opacity:0}}
.spot{position:absolute;translate:-50% -100%;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 9px;font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 3px 0 var(--ink);display:flex;gap:5px;align-items:center;transition:scale .2s}
.spot.hot{background:var(--gold);scale:1.1} .spot.here{border-color:var(--accent);border-width:2.5px} .spot.warn{background:var(--bad);color:var(--paper)} .spot.blue{background:var(--blue);color:var(--paper)}
.spot small{font-size:10px;color:var(--muted)} .spot.hot small,.spot.warn small,.spot.blue small{color:inherit}

#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);border-radius:26px 26px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:84%;overflow-y:auto;z-index:5;box-shadow:0 -8px 0 rgba(42,26,16,.12);translate:0 0;transition:translate .35s cubic-bezier(.2,.9,.3,1.1);touch-action:pan-y}
#sheet[hidden]{display:block!important;translate:0 110%;pointer-events:none}
#sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.05;text-wrap:balance}
#sheet h1 span{color:var(--accent)}
#sheet h2{font-family:var(--display);font-weight:800;font-size:19px;margin:14px 0 8px}
#sheet p{margin:6px 0 12px;color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
.tabs{display:flex;gap:4px;background:var(--paper-2);border-radius:14px;padding:4px;margin:12px 0;overflow-x:auto}
.tabs button{flex:1;box-shadow:none;border-color:transparent;background:transparent;border-radius:10px;padding:8px 6px;white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--paper);border-color:var(--ink)} .tabs button:active{translate:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:2.5px solid var(--ink);border-radius:16px;padding:10px;background:var(--paper-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.card .n{font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.card .n span{font-size:22px}
.card .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.card .m b{color:var(--good)}
.card .q{display:flex;align-items:center;gap:6px;margin-top:auto}
.card .q b{flex:1;text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.card.locked{opacity:.55;background:repeating-linear-gradient(45deg,var(--paper-2) 0 8px,var(--paper) 8px 16px)}
.card.owned{border-style:dashed} .card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--gold)}
.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.total small{font-family:var(--body);font-weight:700;color:var(--muted);font-size:12px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--paper-2);border-radius:14px;padding:10px 12px}
.stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-family:var(--display);font-size:23px;font-variant-numeric:tabular-nums}
.stat b.good{color:var(--good)} .stat b.bad{color:var(--bad)}
.goalrow{display:flex;align-items:center;gap:12px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;margin:6px 0 10px;box-shadow:var(--sh)}.goalrow.ok{background:#fff3c4}.goalrow .stars{font-size:26px;letter-spacing:2px}.goalrow b{display:block;font-family:var(--display);font-size:17px}.goalrow small{color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin:6px 0 4px}
.bars i{flex:1;background:var(--line);border-radius:6px 6px 2px 2px;min-height:4px;position:relative}
.bars i.now{background:var(--accent)}
.bars i::after{content:attr(data-d);position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}
.tip{background:var(--paper-2);border-left:5px solid var(--gold);padding:8px 12px;font-size:13px;margin:8px 0;border-radius:0 12px 12px 0;line-height:1.4}
.tip.bad{border-color:var(--bad)} .tip.blue{border-color:var(--blue)}
.row{display:flex;gap:10px;margin-top:12px} .row button{flex:1}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.zone{background:var(--paper-2);border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35}
.zone b{display:block;font-family:var(--display);font-size:15px}
.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;font-variant-numeric:tabular-nums;margin:8px 0}
.ledger b{text-align:right} .ledger .neg{color:var(--bad)} .ledger .pos{color:var(--good)}

#toast{position:absolute;left:50%;top:14%;translate:-50% 0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none;white-space:nowrap;z-index:20;font-size:14px;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;translate:-50% -8px}
#toast:not(.on){visibility:hidden}
#ach{position:absolute;left:50%;top:74px;translate:-50% -220%;z-index:7;display:flex;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:8px 18px 8px 10px;box-shadow:0 6px 0 var(--ink);transition:translate .45s cubic-bezier(.2,1.3,.3,1);pointer-events:none;max-width:92vw}
#ach.on{translate:-50% 0}
#ach:not(.on){visibility:hidden}
#ach img{width:56px;height:56px;object-fit:contain}
#ach small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
#ach b{font-family:var(--display);font-size:20px;line-height:1.1;display:block}
#ach span{font-size:12px;color:var(--muted)}
#flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:min(14vw,80px);color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:6px 6px 0 var(--accent);opacity:0;z-index:2;text-align:center;line-height:1}
#flash.on{animation:flash 1.8s forwards}
@keyframes flash{0%{opacity:0;scale:.7}20%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0}}
#load{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;text-align:center;font-family:var(--display);font-weight:800}
#load .t{font-size:44px;line-height:1;color:var(--accent);-webkit-text-stroke:1.5px var(--ink)}
#load .b{width:220px;height:10px;border:2.5px solid var(--ink);border-radius:6px;margin:14px auto 0;overflow:hidden;background:var(--paper)}
#load .b i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
#load small{display:block;color:var(--muted);font-family:var(--body);font-weight:700;margin-top:8px;font-size:12px}
#load[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.bub.hurry,#hud.bump .cash{animation:none}}

/* ===== v4 additions ===== */
#dock{position:absolute;right:10px;top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:3}
#dock button{width:46px;height:46px;border-radius:50%;padding:0;font-size:21px;display:grid;place-items:center}
#ebar{position:absolute;left:12px;top:calc(88px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
#ebar.on{opacity:1}#ebar span{background:var(--accent);color:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:11px;font-family:var(--display);width:fit-content;box-shadow:0 2px 0 var(--ink)}
#mission{position:absolute;left:12px;top:calc(118px + env(safe-area-inset-top,0px));max-width:min(300px,56vw);background:rgba(255,247,230,.94);border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px;box-shadow:var(--sh);pointer-events:none;z-index:2;display:none}
#mission.on{display:block}#mission small{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}#mission b{font-family:var(--display);font-size:13px;line-height:1.15;display:block}
#npcbox{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));translate:-50% 30px;max-width:min(440px,90vw);display:flex;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:8px 14px 8px 8px;box-shadow:0 5px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,translate .3s;z-index:4}
#npcbox.on{opacity:1;translate:-50% 0}#npcbox img{width:52px;height:64px;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}#npcbox b{display:block;font-family:var(--display);font-size:15px;color:var(--accent)}#npcbox span{font-size:13px;line-height:1.35;font-weight:600}
#price{position:absolute;right:18px;bottom:calc(122px + env(safe-area-inset-bottom,0px));height:42px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:13px;padding:0 12px;z-index:3;display:flex;align-items:center;gap:4px}
#price span{font-size:16px}#price.pr0{background:#d8efe0}#price.pr2{background:#ffd9cf}
.mkgrid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card.mk .n{position:relative}.card.mk .n em.tr{margin-left:auto;font-style:normal;font-size:18px}
.mkg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px}.mkg small{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}.mkg b{font-family:var(--display);font-size:13px;font-weight:800}
.pos{color:var(--good)}.neg{color:var(--bad)}
.trendbar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0}.trendbar b{color:var(--accent)}
.foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 14px);padding:10px 0 calc(16px + env(safe-area-inset-bottom,0px));margin-top:8px;z-index:2}.foot .buybar{margin:0 0 8px}.buybar{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px;margin:12px 0 8px;box-shadow:var(--sh);z-index:2}
.buybar small{display:block;font-size:11px;color:var(--muted);font-weight:700}.buybar b{font-family:var(--display);font-size:20px;display:block}.buybar.warn{background:#ffe6dc}
.sl{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:700}.sl span{width:120px;font-size:14px}.sl input{flex:1;accent-color:var(--accent);height:28px}.sl b{width:34px;text-align:right;font-family:var(--display)}
.tgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}.tg{text-align:left;display:flex;flex-direction:column;gap:2px;font-size:14px}.tg small{font-weight:600;color:var(--muted);font-size:11px}.tg b{font-family:var(--display);font-size:13px;color:var(--muted)}.tg.on{background:#d8efe0}.tg.on b{color:var(--good)}
.mapbtn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px}.mapbtn small{font-weight:600;color:var(--muted);font-size:11px}.mapbtn.hot{background:#fff0c2}
.evp{display:inline-block;background:var(--paper-2);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin:0 6px 4px 0}

/* ===================== v5 DESIGN SYSTEM ===================== */
:root{
 --cream:#fff7e6;--paper:#fff7e6;--paper-2:#f7e8c9;--coffee:#2a1a10;--ink:#2a1a10;--brown:#7a4a26;--terra:#d9482b;--accent:#d9482b;
 --green:#2f9b62;--good:#2f9b62;--blue:#3a86c8;--yellow:#f2b632;--gold:#f2b632;--orange:#f08a3c;--danger:#c23a1c;--bad:#c23a1c;--success:#2f9b62;--muted:#7d5f40;--line:#e3c995;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r1:10px;--r2:14px;--r3:20px;--r4:28px;--bw:2.5px;
 --sh1:0 3px 0 var(--coffee);--sh:0 3px 0 var(--coffee);--sh2:0 5px 0 var(--coffee),0 12px 22px rgba(42,26,16,.22);--hi:inset 0 2px 0 rgba(255,255,255,.6);
 --fs-cap:11px;--fs-body:14px;--fs-sec:18px;--fs-title:26px;--fs-disp:34px;
 --t-micro:.15s;--t-panel:.26s;--t-reward:.45s;--t-major:.75s;--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);
 --navH:env(safe-area-inset-bottom,0px);
 --tex:radial-gradient(rgba(122,74,38,.07) 1px,transparent 1.2px) 0 0/9px 9px;
}
body.hasnav{--navH:calc(72px + env(safe-area-inset-bottom,0px))}
/* typography levels */
.t-disp{font:800 var(--fs-disp)/1 var(--display)}.t-title{font:800 var(--fs-title)/1.05 var(--display)}.t-sec{font:800 var(--fs-sec)/1.1 var(--display)}
.t-body{font:500 var(--fs-body)/1.45 var(--body)}.t-cap{font:700 var(--fs-cap)/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.t-num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
/* button (GameButton) */
button{background:linear-gradient(#fffaf0,#f7e8c9);box-shadow:var(--hi),var(--sh);border-radius:var(--r2);transition:translate var(--t-micro) var(--out),box-shadow var(--t-micro),filter var(--t-micro)}
button:hover{filter:brightness(1.04)}button:active{translate:0 3px;box-shadow:var(--hi),0 0 0 var(--coffee)}
button.pri{background:linear-gradient(#ee6a43,#d9482b);color:#fff7e6;text-shadow:0 2px 0 rgba(42,26,16,.35)}
button.gold{background:linear-gradient(#ffd668,#f2b632)}button.good{background:linear-gradient(#4cbc82,#2f9b62);color:#fff7e6}button.blue{background:linear-gradient(#5aa4e3,#3a86c8);color:#fff7e6}
button.sm{min-height:36px;min-width:44px}
@media (pointer:coarse){button.sm{min-height:44px;min-width:46px}}
/* HUD badges */
#hud{gap:6px;padding-top:calc(8px + env(safe-area-inset-top,0px));flex-wrap:wrap}
.chip{flex-direction:row;align-items:center;gap:6px;background:linear-gradient(#fffaf0,#f7e8c9);border:var(--bw) solid var(--coffee);border-radius:999px;padding:3px 12px 3px 8px;box-shadow:var(--hi),var(--sh);min-height:38px}
.chip small{font-size:9.5px;letter-spacing:.07em;line-height:1;display:block;color:var(--muted)}
.chip b{font-size:15px;line-height:1.05}
.chip>i{font-style:normal;font-size:18px}
.chip>div{display:flex;flex-direction:column;justify-content:center}
.chip.cash{background:linear-gradient(#ffe48a,#f2b632);padding-right:16px}.chip.cash b{font-size:23px;color:var(--coffee);letter-spacing:-.01em}
.chip.cash img{width:28px;height:28px;margin:0 2px 0 0;vertical-align:0;filter:drop-shadow(0 2px 0 rgba(42,26,16,.3))}
.chip.rep b{color:#e08a1e;letter-spacing:1px;font-size:14px}
.chip .bar{width:58px;height:8px;margin:0;border:1.5px solid var(--coffee);background:#e9d3a8;border-radius:5px}
.chip.goal .bar{width:84px;margin-top:3px}
.chip.goal.done{background:linear-gradient(#cdeed8,#9bdcb4)}
#menuBtn{width:42px;height:42px;padding:0;border-radius:50%;font-size:20px;display:grid;place-items:center}
@media (max-width:640px){#hud{padding-left:8px;padding-right:8px}.chip.cash b{font-size:21px}.chip{padding:2px 10px 2px 7px}}
/* bottom nav */
#nav{position:absolute;z-index:4;left:50%;translate:-50% 0;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(540px,94vw);display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:linear-gradient(#fff4da,#f0d9a8);border:var(--bw) solid var(--coffee);border-radius:24px;padding:4px 6px 5px;box-shadow:var(--hi),var(--sh2)}
#nav button{box-shadow:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 2px;min-height:56px;border-radius:16px;position:relative;font-family:var(--display);font-weight:800;font-size:11px;color:var(--muted);transition:color var(--t-micro)}
#nav button:active{translate:0 2px}
#nav button span{font-size:23px;line-height:1;display:grid;place-items:center;width:40px;height:34px;border-radius:14px;transition:transform var(--t-panel) var(--spring),background var(--t-micro),box-shadow var(--t-panel)}
#nav button.on{color:var(--coffee)}
#nav button.on span{transform:translateY(-10px) scale(1.14);background:radial-gradient(circle at 50% 30%,#ffe8a0,#f2b632);border:2px solid var(--coffee);box-shadow:0 3px 0 var(--coffee),0 0 14px 3px rgba(242,182,50,.6)}
#nav button.on b{transform:translateY(-8px)}
#nav button b{font-weight:800;transition:transform var(--t-panel) var(--spring)}
#nav button i{position:absolute;right:calc(50% - 26px);top:2px;width:12px;height:12px;border-radius:50%;background:var(--terra);border:2px solid var(--cream)}
#nav[hidden]{display:grid!important}
@media (max-width:640px){#nav{left:0;right:0;translate:0 0;width:auto;bottom:0;border-radius:24px 24px 0 0;border-width:var(--bw) 0 0;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px))}}
/* controls clear the nav */
#pad{bottom:calc(var(--navH) + 14px)}#act{bottom:calc(var(--navH) + 16px)}#tray{bottom:calc(var(--navH) + 14px)}#prem{bottom:calc(var(--navH) + 118px)}#ride{bottom:calc(var(--navH) + 30px)}#price{bottom:calc(var(--navH) + 120px)}#npcbox{bottom:calc(var(--navH) + 120px)}
@media (max-width:640px){#price{bottom:calc(var(--navH) + 118px)}#pad{bottom:calc(var(--navH) + 10px)}#act{bottom:calc(var(--navH) + 12px)}}
#dock{display:none!important}#turn{display:none!important}
/* tray -> sleek tiles */
.tr{border-radius:12px;background:linear-gradient(#fffaf0,#f7e8c9);box-shadow:var(--hi),var(--sh)}
/* sheet */
#sheet{background:var(--tex),linear-gradient(#fff9ec,#fff3d8);border-radius:var(--r4) var(--r4) 0 0;transition:translate var(--t-panel) var(--out);padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:thin;overscroll-behavior:contain;touch-action:pan-y;box-shadow:0 -6px 0 rgba(42,26,16,.14),0 -20px 40px rgba(42,26,16,.18)}
body.hasnav #sheet{bottom:var(--navH);max-height:calc(86% - var(--navH));padding-bottom:16px;border-radius:var(--r4)}
@media (min-width:900px){#sheet{left:50%;right:auto;width:min(760px,96vw);translate:-50% 0}#sheet[hidden]{translate:-50% 110%}}
#sheet::before{content:"";display:block;position:sticky;top:0;width:56px;height:6px;border-radius:3px;background:var(--line);margin:6px auto 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#sheet h1{display:inline-block;background:linear-gradient(#ee6a43,#d9482b);color:#fff7e6;border:var(--bw) solid var(--coffee);border-radius:var(--r2);padding:5px 16px 6px;font-size:23px;box-shadow:var(--hi),0 4px 0 var(--coffee);transform:rotate(-.8deg);text-shadow:0 2px 0 rgba(42,26,16,.35);margin:2px 0 8px}
#sheet h1 span{background:var(--yellow);color:var(--coffee);border-radius:999px;padding:0 10px;font-size:13px;margin-left:6px;text-shadow:none;vertical-align:3px}
#sheet h1 span:empty{display:none}
#sheet h2{font-size:var(--fs-sec);display:flex;align-items:center;gap:8px}#sheet h2::after{content:"";flex:1;height:0;border-top:2.5px dotted var(--line)}
#scrim{position:absolute;inset:0;background:rgba(42,26,16,.38);opacity:0;pointer-events:none;transition:opacity var(--t-panel);z-index:4}
body.sheetopen.hasnav #scrim{opacity:1;pointer-events:auto}
.tabs{background:#ecd5a4;border:var(--bw) solid var(--coffee);border-radius:var(--r2);padding:3px;box-shadow:inset 0 3px 0 rgba(42,26,16,.12)}
.tabs button{border:2px solid transparent;border-radius:11px;background:transparent;font-family:var(--display);font-size:14px;min-height:38px;transition:background var(--t-micro),scale var(--t-micro)}
.tabs button.on{background:linear-gradient(#fffaf0,#fff0cc);border-color:var(--coffee);box-shadow:0 2px 0 var(--coffee)}
.card{background:var(--tex),linear-gradient(#fff6e0,#f7e8c9);border-radius:var(--r3);box-shadow:var(--hi),0 3px 0 rgba(42,26,16,.85);transition:translate var(--t-micro) var(--out)}
.card.sel{box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--coffee)}
.zone{background:linear-gradient(#fff6e0,#f7e8c9);border:2px solid rgba(42,26,16,.18);border-radius:var(--r2)}
.stat{background:linear-gradient(#fff6e0,#f7e8c9);border:2px solid rgba(42,26,16,.18);border-radius:var(--r2)}
.bar{border:1.5px solid var(--coffee);background:#e9d3a8;height:10px;border-radius:6px}
.bar i{border-radius:5px;background:linear-gradient(#52c88a,#2f9b62);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.bar.sta i{background:linear-gradient(#6ab4ee,#3a86c8)}
.chip.goal .bar i{background:linear-gradient(#ffcf5a,#e8541f)}
/* toasts + reward */
#toast{display:none}
#toasts{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));translate:-50% 0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(94vw,440px)}
.tt{display:flex;align-items:center;gap:8px;background:var(--coffee);color:var(--cream);border-radius:999px;padding:7px 16px 7px 8px;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:ttin var(--t-panel) var(--spring) both;max-width:100%}
.tt i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-size:15px;flex:none}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt.coin{background:#5a3512}.tt.coin i{background:var(--yellow)}.tt.ok i{background:#9bdcb4}.tt.warn{background:#7f1f0e}.tt.warn i{background:#ffd0c4}
.tt.out{animation:ttout .25s ease-in forwards}
@keyframes ttin{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}@keyframes ttout{to{opacity:0;transform:translateY(-8px) scale(.95)}}
.rw{position:relative;width:min(92vw,360px);margin-top:4px;background:var(--tex),linear-gradient(#fff9ec,#fbe9bd);border:3px solid var(--coffee);border-radius:var(--r3);box-shadow:0 6px 0 var(--coffee),0 14px 28px rgba(42,26,16,.3);padding:20px 14px 12px;text-align:center;animation:rwin var(--t-reward) var(--spring) both}
.rw.out{animation:ttout .3s ease-in forwards}
.rw .badge{position:absolute;left:50%;top:-14px;translate:-50% 0;background:var(--cat,var(--green));color:#fff;border:2.5px solid var(--coffee);border-radius:999px;padding:2px 14px;font:800 13px var(--display);letter-spacing:.06em;box-shadow:0 3px 0 var(--coffee);white-space:nowrap}
.rw b{display:block;font:800 16px/1.15 var(--display);margin-top:2px}.rw small{color:var(--muted);font-weight:700;font-size:12px}
.rw .amt{font:800 30px/1.1 var(--display);color:#c27a00;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-variant-numeric:tabular-nums}.rw .amt img{width:30px;height:30px}
.rw .co{position:absolute;left:50%;top:60%;width:18px;height:18px;background:url(a/220.webp) center/contain no-repeat;animation:coin .7s var(--out) forwards;pointer-events:none}
@keyframes rwin{from{opacity:0;transform:translateY(-30px) scale(.8) rotate(-3deg)}to{opacity:1;transform:none}}

/* modal */
#modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(42,26,16,.55);opacity:0;pointer-events:none;transition:opacity var(--t-panel)}

.mhead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}

.mc .pb{display:flex;align-items:center;gap:8px;margin-top:5px}.mc .pb .bar{flex:1;margin:0;width:auto}.mc .pb .bar i{background:linear-gradient(color-mix(in srgb,var(--cat) 70%,#fff),var(--cat))}.mc .pb b{font:800 13px var(--display);min-width:44px;text-align:right}
.mc .rwd{flex:none;text-align:center;font:800 14px var(--display);background:var(--yellow);border:2px solid var(--coffee);border-radius:12px;padding:3px 9px;line-height:1.1;box-shadow:0 2px 0 var(--coffee)}.mc .rwd small{display:block;font:700 9px var(--body);opacity:.7}

.mc.done::after{content:"✓ ĐÃ NHẬN";position:absolute;right:8px;top:6px;font:800 10px var(--display);letter-spacing:.08em;color:var(--green);background:#fff;border:2px solid var(--green);border-radius:999px;padding:0 8px;transform:rotate(4deg);animation:stamp var(--t-reward) var(--spring)}
@keyframes stamp{from{transform:scale(2) rotate(-12deg);opacity:0}}
.mc.lock{opacity:.6;filter:grayscale(.5)}
.path{position:relative;margin:10px 0 4px 4px}
.node{position:relative;display:flex;gap:12px;padding-bottom:18px}

/* inventory + rarity */
.crate{display:flex;gap:3px;margin:4px 0 0}.crate i{flex:1;height:14px;border-radius:4px;border:1.5px solid var(--coffee);background:#e9d3a8}.crate i.f{background:linear-gradient(#ffd668,#f2b632)}.crate i.w{background:linear-gradient(#ff9d7a,#d9482b)}
.it{position:relative;display:flex;flex-direction:column;gap:4px;padding:8px;border:var(--bw) solid var(--coffee);border-radius:var(--r3);background:var(--tex),linear-gradient(#fffaf0,#f7e8c9);box-shadow:var(--hi),0 3px 0 var(--coffee);overflow:hidden}
.it .tile{display:grid;place-items:center;height:64px;border-radius:14px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 28%,#fff),color-mix(in srgb,var(--rc) 14%,#f7e8c9));border:2px solid color-mix(in srgb,var(--rc) 60%,var(--coffee))}
.it .tile img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(42,26,16,.2))}
.it .qt{position:absolute;right:6px;top:6px;background:var(--coffee);color:var(--cream);border-radius:999px;font:800 13px var(--display);padding:0 8px}
.it .nm{font:800 14px/1.1 var(--display)}.it .vl{font-size:11px;color:var(--muted);font-weight:700}
.rb{display:inline-flex;align-items:center;gap:4px;font:800 9.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--rc,#a89a86)}.rb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rc,#a89a86);box-shadow:0 0 0 2px color-mix(in srgb,var(--rc,#a89a86) 30%,transparent)}
.rb.sig::before{box-shadow:0 0 0 2px rgba(217,72,43,.3),0 0 8px 2px rgba(242,182,50,.8)}
.fb{height:7px;border-radius:4px;background:#e9d3a8;border:1.5px solid var(--coffee);overflow:hidden}.fb i{display:block;height:100%;background:linear-gradient(#7fd8a4,#2f9b62)}.fb.w i{background:linear-gradient(#ffb48f,#e8541f)}
/* market: price-tag cards */
.card.mk{position:relative;padding:12px 12px 10px 14px;overflow:visible}
.card.mk::before{content:"";position:absolute;left:14px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--coffee);z-index:1}
.card.mk::after{content:"";position:absolute;left:19px;top:-18px;width:2px;height:16px;background:var(--coffee);opacity:.55;transform:rotate(14deg)}
.card.mk .pt{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.ptag{margin-left:auto;background:linear-gradient(#ffe48a,#f2b632);border:2px solid var(--coffee);padding:1px 10px 1px 18px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);font:800 18px var(--display);font-variant-numeric:tabular-nums;border-radius:0 8px 8px 0}
.chipx{display:inline-flex;align-items:center;gap:3px;font:800 11px var(--body);background:#fff;border:1.5px solid var(--coffee);border-radius:999px;padding:0 8px}.chipx.up{background:#ffd9cf}.chipx.dn{background:#d3f0de}.chipx.hot{background:#ffe08a}
.sub{font:800 13px var(--display);text-align:right;min-width:52px;color:var(--muted)}
.card.mk .q{gap:5px}.card.mk .q b{font-size:20px}
.card.mk.sel{box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--coffee)}
/* cart screen */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#ecd5a4;border:var(--bw) solid var(--coffee);border-radius:var(--r2);padding:3px;margin:2px 0 10px;box-shadow:inset 0 3px 0 rgba(42,26,16,.12)}
.seg button{box-shadow:none;border:2px solid transparent;background:transparent;font-family:var(--display);min-height:40px}.seg button.on{background:linear-gradient(#fffaf0,#fff0cc);border-color:var(--coffee);box-shadow:0 2px 0 var(--coffee)}
.stage{position:relative;height:236px;border-radius:var(--r3);border:var(--bw) solid var(--coffee);background:radial-gradient(ellipse at 50% 100%,rgba(42,26,16,.18) 0 22%,transparent 23%),linear-gradient(#bfe3f7 0 58%,#d9c7a1 58% 100%);overflow:hidden;box-shadow:inset 0 4px 0 rgba(255,255,255,.4)}
.stage::before{content:"";position:absolute;left:0;right:0;top:58%;height:12px;background:repeating-linear-gradient(90deg,#c8553a 0 26px,#f2e2bf 26px 52px);opacity:.9}
.stage img.cartimg{position:absolute;left:50%;bottom:14px;translate:-50% 0;height:158px;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 0 rgba(42,26,16,.18));transform-origin:50% 100%}
.stage img.cartimg.up{animation:cartup .9s var(--spring)}
@keyframes cartup{0%{transform:scale(1)}25%{transform:scale(1.2,.88) rotate(-3deg)}55%{transform:scale(.94,1.1) rotate(2deg)}100%{transform:scale(1)}}
.stage .spk{position:absolute;font-size:22px;animation:spk .9s ease-out forwards;pointer-events:none}@keyframes spk{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(1.3)}}
.stage .nameplate{position:absolute;left:50%;top:8px;translate:-50% 0;background:linear-gradient(#ee6a43,#d9482b);color:#fff7e6;border:var(--bw) solid var(--coffee);border-radius:var(--r2);padding:2px 16px;font:800 17px var(--display);box-shadow:0 3px 0 var(--coffee);white-space:nowrap}
.pips{display:flex;gap:5px;justify-content:center;margin:10px 0 2px}.pips i{width:34px;height:12px;border-radius:6px;border:2px solid var(--coffee);background:#e9d3a8}.pips i.f{background:linear-gradient(#ffd668,#f2b632)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.sg div{background:linear-gradient(#fff6e0,#f7e8c9);border:2px solid rgba(42,26,16,.2);border-radius:var(--r2);padding:6px 4px;text-align:center}.sg b{display:block;font:800 17px var(--display)}.sg small{font:700 10px var(--body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -4px;touch-action:pan-x}
.cc{flex:none;width:140px;scroll-snap-align:start;display:flex;flex-direction:column;gap:3px;padding:8px;text-align:center;border:var(--bw) solid var(--coffee);border-radius:var(--r3);background:var(--tex),linear-gradient(#fffaf0,#f7e8c9);box-shadow:var(--hi),0 3px 0 var(--coffee);cursor:pointer}
.cc.sel{box-shadow:0 0 0 3px var(--yellow),0 3px 0 var(--coffee);background:linear-gradient(#fff3c4,#ffe08a)}.cc.lock{opacity:.6}
.cc img{height:78px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(42,26,16,.18))}.cc b{font:800 14px/1.1 var(--display)}.cc small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.25}
.compat{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.compat img{width:26px;height:26px;object-fit:contain;background:#fff;border:1.5px solid var(--coffee);border-radius:8px;padding:1px}
.benefit{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}.benefit span{background:#d3f0de;border:2px solid var(--coffee);border-radius:999px;padding:1px 10px;font:800 12px var(--body)}
/* character screen */
.dress{display:grid;grid-template-columns:150px 1fr;gap:10px}
.pedestal{position:relative;height:210px;border-radius:var(--r3);border:var(--bw) solid var(--coffee);background:radial-gradient(ellipse at 50% 88%,rgba(42,26,16,.22) 0 30%,transparent 31%),linear-gradient(#ffe7b0,#f6cd7a);display:grid;place-items:end center;overflow:hidden}
.pedestal img{height:178px;margin-bottom:12px;animation:idle 2.4s ease-in-out infinite;transform-origin:50% 100%}@keyframes idle{50%{transform:scaleY(1.025) translateY(-2px)}}
.pedestal .nm{position:absolute;left:6px;right:6px;top:6px;text-align:center;font:800 13px var(--display);background:var(--cream);border:2px solid var(--coffee);border-radius:10px}
.slotrow{display:flex;gap:6px;margin:6px 0 10px;overflow-x:auto}.slotrow span{flex:none;width:44px;height:44px;border-radius:12px;border:2px dashed rgba(42,26,16,.35);display:grid;place-items:center;font-size:20px;opacity:.6}.slotrow span.on{border-style:solid;background:var(--yellow);opacity:1;border-color:var(--coffee)}
@media (max-width:640px){.dress{grid-template-columns:1fr}.pedestal{height:190px}}
/* map */
.city{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.dist{position:relative;display:flex;gap:10px;align-items:center;border:var(--bw) solid var(--coffee);border-radius:var(--r3);padding:8px 10px;box-shadow:var(--hi),0 3px 0 var(--coffee);overflow:hidden}
.dist .dl{flex:none;width:104px;text-align:center}.dist b{display:block;font:800 15px/1.1 var(--display)}.dist .sk{font-size:22px;letter-spacing:-2px;line-height:1.1}.dist small{font:700 10px/1.2 var(--body);color:var(--muted);display:block}
.dist .dp{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.dist.lock .dp{opacity:.4;filter:grayscale(.6)}
.pin{position:relative;width:40px;height:40px;border-radius:50% 50% 50% 6px;rotate:-45deg;border:2.5px solid var(--coffee);background:var(--cream);box-shadow:0 3px 0 var(--coffee);padding:0;display:grid;place-items:center;margin:2px}
.pin:active{translate:0 0}.pin span{rotate:45deg;font-size:19px}.pin.hot{background:var(--yellow)}
.pin.here{background:var(--terra);animation:pinb 1s ease-in-out infinite}@keyframes pinb{50%{translate:-3px -5px}}
/* misc */
.empty{text-align:center;padding:18px 10px;color:var(--muted);font-weight:700}.empty big{display:block;font-size:40px}
.biz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.biz div{display:flex;gap:10px;align-items:center;background:linear-gradient(#fff6e0,#f7e8c9);border:var(--bw) solid var(--coffee);border-radius:var(--r3);padding:8px 10px;box-shadow:0 3px 0 var(--coffee)}.biz span{font-size:28px}.biz small{display:block;font:700 10px var(--body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}.biz b{font:800 18px var(--display)}
#load .b{border-radius:8px}
@media (max-width:640px){#toasts{top:calc(108px + env(safe-area-inset-top,0px))}}@media (pointer:coarse){#kbd{display:none!important}}
@media (max-width:640px){.tabs button{font-size:12.5px;padding:8px 3px;flex:1 0 auto}#tray{left:12px;translate:0;justify-content:flex-start;max-width:calc(100% - 150px);bottom:calc(var(--navH) + 100px)}}
.mcard,.rw,.mc,.cc,.it,.ring,.dist,.node,.stage,.stat,.card,.biz div,.sg div{box-sizing:border-box}
body.rm .tt,body.rm .rw,body.rm .mcard{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#coach.on,#act.open,#act.shop,#act.cafe,.pedestal img,.node.cur .nd,.pin.here{animation:none}}
/* device-adaptive controls */
#joy{position:absolute;left:14px;bottom:calc(var(--navH) + 16px);width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,247,230,.6),rgba(255,247,230,.25));border:3px solid var(--coffee);box-shadow:0 4px 0 rgba(42,26,16,.5);z-index:3;touch-action:none;display:none}
#joy::before,#joy::after{position:absolute;top:50%;translate:0 -50%;font-size:22px;color:var(--coffee);opacity:.6}#joy::before{content:"◀";left:12px}#joy::after{content:"▶";right:12px}
#joy i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:linear-gradient(#fffaf0,#f2b632);border:3px solid var(--coffee);box-shadow:0 4px 0 var(--coffee);transition:transform .08s}
body.dev-mobile #joy,body.dev-tablet #joy{display:block}body.dev-mobile #pad,body.dev-tablet #pad,body.dev-desktop #pad{display:none!important}
body.dev-tablet #joy{width:168px;height:168px}body.dev-tablet #joy i{width:78px;height:78px;margin:-39px}body.dev-tablet #act{width:112px;height:112px}body.dev-tablet #nav button{min-height:64px;font-size:12.5px}
body.dev-desktop #nav button::before{content:attr(data-k);position:absolute;top:1px;left:7px;font:800 9px var(--body);opacity:.45}
body.dev-desktop #act{width:88px;height:88px}
@media (max-width:640px){#tray{bottom:calc(var(--navH) + 160px)}}
#sheet[hidden]{visibility:hidden;transition:translate var(--t-panel) var(--out),visibility 0s var(--t-panel)}
body.hasnav #sheet[hidden]{bottom:0}
#kbd{top:auto!important;bottom:calc(var(--navH) + 10px);left:14px!important;translate:0!important;text-align:left;max-width:260px;font-size:11px}
body.hasnav{--navH:calc(72px + env(safe-area-inset-bottom,0px))}
body.hasnav #sheet{bottom:calc(var(--navH) + 8px)}
/* ================= v7: LESS UI, MORE WORLD ================= */
:root{--bw:1.5px;--line2:rgba(42,26,16,.28);--soft:rgba(42,26,16,.55);--r1:8px;--r2:12px;--r3:16px;--r4:22px;--tex:none;
 --sh:0 1px 0 rgba(42,26,16,.18);--sh1:0 1px 0 rgba(42,26,16,.18);--sh2:0 6px 18px rgba(42,26,16,.2);--hi:none;--glass:rgba(34,21,12,.74);--cr:#fff3da;--gd:#ffd36b;--navH:0px}
body.hasnav{--navH:calc(62px + env(safe-area-inset-bottom,0px))}
#kbd,#menuBtn,#turn,#pad{display:none!important}
/* HUD: one thin row, no pills */
#hud{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 16px;color:var(--cr);text-shadow:0 1px 3px rgba(0,0,0,.6);background:linear-gradient(rgba(30,18,10,.5),rgba(30,18,10,0));pointer-events:none;flex-wrap:nowrap}
#hud .goal{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.18)}
#hud .goal #goalB{display:block;height:100%;background:var(--gd);transition:width .4s}#hud .goal.done #goalB{background:#7fe0a4}
#hud .hl{display:flex;align-items:center;gap:5px;font:700 17px var(--display);letter-spacing:.01em}#hud .hl img{width:18px;height:18px;object-fit:contain;filter:none}
#hud .hl b{font:inherit;color:var(--cr)}
#hud .hc{text-align:center;font:500 12px var(--body);white-space:nowrap;opacity:.95}#hud .hc b{font:600 12px var(--body)}
#hud .hr{justify-self:end;display:flex;align-items:center;gap:9px;font:600 12px var(--body)}#hud .hr b{font:inherit}
#hud .hr .sta{width:40px;height:4px;border:0;border-radius:2px;background:rgba(255,255,255,.25);margin:0;overflow:hidden}#hud .hr .sta i{display:block;height:100%;border-radius:2px}
/* nav: thin floating dock */
#nav,#nav[hidden]{left:50%!important;right:auto!important;translate:-50% 0!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;width:min(400px,calc(100vw - 24px))!important;height:46px;padding:0 4px!important;gap:0!important;background:var(--glass)!important;border:0!important;border-radius:16px!important;box-shadow:0 2px 10px rgba(0,0,0,.22)!important;grid-template-columns:repeat(6,1fr)}
#nav button{min-height:0!important;height:46px;padding:0!important;gap:0!important;color:rgba(255,243,218,.62);justify-content:center;font-weight:500}
#nav button span,#nav button.on span{width:auto!important;height:auto!important;font-size:18px!important;background:none!important;border:0!important;box-shadow:none!important;transform:none!important;filter:grayscale(.25);transition:transform .2s var(--spring)}
#nav button b{font:500 8.5px var(--body)!important;letter-spacing:.02em;margin-top:1px;color:inherit}
#nav button.on{color:var(--gd)}#nav button.on span{transform:translateY(-3px) scale(1.12)!important;filter:none}#nav button.on b{transform:none!important}
#nav button i{right:calc(50% - 16px);top:6px;width:7px;height:7px;border:0;background:#ff6a45}
body.dev-desktop #nav button::before{display:none}
/* joystick: ring + small thumb */
#joy{width:108px;height:108px;left:16px;bottom:calc(var(--navH) + 14px);background:rgba(20,12,6,.1);border:1.5px solid rgba(255,243,218,.4);box-shadow:none}
#joy::before,#joy::after{content:none!important}
#joy i{width:44px;height:44px;margin:-22px;background:rgba(255,243,218,.5);border:1.5px solid rgba(255,243,218,.75);box-shadow:none}
body.dev-tablet #joy{width:128px;height:128px}body.dev-tablet #joy i{width:50px;height:50px;margin:-25px}
/* action: small, one colour, only when doable */
#act,body.dev-tablet #act,body.dev-desktop #act{right:16px;bottom:calc(var(--navH) + 14px);width:70px;height:70px;border-radius:20px;background:var(--terra);color:#fff;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 2px 0 rgba(42,26,16,.3);font:600 11px/1.1 var(--body);gap:3px;animation:none!important}
#act span{font-size:24px}
#act.shop,#act.cafe,#act.home{background:var(--terra);color:#fff}
#act.open{background:var(--glass);width:56px;height:56px;border-radius:16px;font-size:10px;border-color:rgba(255,243,218,.3);bottom:calc(var(--navH) + 21px);right:23px}#act.open span{font-size:18px}
#ride{right:94px;bottom:calc(var(--navH) + 14px);width:50px;height:50px;border-radius:15px;background:var(--glass);color:var(--cr);font:500 9px var(--body);box-shadow:none;border:0}#ride span{font-size:18px}#ride.on{background:var(--terra)}
#prem{right:16px;bottom:calc(var(--navH) + 92px);border-radius:12px;font:600 12px var(--body);background:var(--glass);color:var(--cr);border:0;box-shadow:none}
/* price: only while selling */
#price{display:flex!important;opacity:0;pointer-events:none;right:16px;bottom:calc(var(--navH) + 92px);height:auto;padding:3px;gap:2px;border-radius:999px;background:var(--glass);box-shadow:none;transition:opacity .25s}
#price.on{opacity:1;pointer-events:auto}
#price small{font:600 9px var(--body);letter-spacing:.08em;color:rgba(255,243,218,.65);padding:0 6px 0 8px}
#price button{min-height:0;height:26px;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--cr);font:500 12px var(--body);box-shadow:none}
#price button.on{background:var(--cr);color:var(--coffee);font-weight:600}
/* tray: one chip, only when selling */
#tray{display:flex!important;opacity:0;pointer-events:none;left:50%;translate:-50% 0;bottom:calc(var(--navH) + 14px);max-width:none;background:var(--glass);color:var(--cr);border-radius:999px;padding:5px 12px;font:600 12px var(--body);gap:0;transition:opacity .25s;white-space:nowrap}
#tray.on{opacity:.95;pointer-events:auto;cursor:pointer}#tray.warn{color:#ffb4a0}
body.sheetopen #act,body.sheetopen #price,body.sheetopen #tray,body.sheetopen #joy,body.sheetopen #ride,body.sheetopen #prem{opacity:0!important;pointer-events:none!important}
/* one tiny tutorial pill / objective text / npc */
#coach,#coach.on{left:14px!important;top:calc(34px + env(safe-area-inset-top,0px)) !important;translate:none;transform:none!important;animation:none!important;background:var(--glass);color:var(--cr);border-radius:999px;padding:4px 12px;font:500 12px var(--body);box-shadow:none;border:0;z-index:3;max-width:min(300px,76vw);white-space:nowrap}
#coach::after{display:none}#coach small{display:inline;font:600 11px var(--body);color:var(--gd);opacity:1;letter-spacing:0;margin-right:6px}#coach.ok small{color:#7fe0a4}
#mission{left:14px;top:calc(34px + env(safe-area-inset-top,0px));max-width:min(270px,64vw);background:none;border:0;box-shadow:none;padding:0;color:var(--cr);text-shadow:0 1px 3px rgba(0,0,0,.65)}
#mission small{font:500 11px var(--body);letter-spacing:0;text-transform:none;color:var(--cr);opacity:.9}#mission b{font:500 11px var(--body);opacity:.85}#mission b i{display:none}
#npcbox{left:14px;top:calc(34px + env(safe-area-inset-top,0px));bottom:auto;translate:0 -6px;max-width:min(300px,76vw);gap:8px;background:var(--glass);border:0;border-radius:14px;padding:6px 12px 6px 6px;box-shadow:none;z-index:3;color:var(--cr)}
#npcbox.on{translate:0 0}#npcbox img{width:30px;height:38px;filter:none}#npcbox b{font:600 11px var(--body);color:var(--gd)}#npcbox span{font:400 12px/1.3 var(--body)}
body:has(#npcbox.on) #mission,body:has(#npcbox.on) #coach{opacity:0}
#ebar{left:14px;top:calc(60px + env(safe-area-inset-top,0px))}#ebar span{background:var(--glass);color:var(--cr);border:0;box-shadow:none;font:500 11px var(--body);padding:2px 9px}
#combo{left:auto;right:14px;top:calc(34px + env(safe-area-inset-top,0px));translate:none;background:none;border:0;box-shadow:none;padding:0;color:var(--gd);text-shadow:0 1px 3px rgba(0,0,0,.65);gap:6px;overflow:visible}
#combo b{font:700 15px var(--display)}#combo small{font:500 10px var(--body)}#combo i{left:0;right:0;bottom:-4px;height:2px;border-radius:1px}
#flash{font-size:min(7vw,30px);font-weight:600;-webkit-text-stroke:0;text-shadow:0 2px 8px rgba(0,0,0,.55);color:var(--cr);place-items:start center;padding-top:24%;letter-spacing:.04em}
/* toasts + reward: small, never stacked above 2 */
#toasts,#toasts{top:calc(86px + env(safe-area-inset-top,0px))}
.tt{background:var(--glass);box-shadow:none;padding:5px 12px 5px 6px;font:500 12px var(--body);gap:6px}
.tt i{width:20px;height:20px;font-size:12px;background:rgba(255,255,255,.12)!important}
.rw{width:auto;max-width:92vw;display:flex;align-items:center;gap:8px;background:var(--glass);color:var(--cr);border:0;border-radius:999px;box-shadow:none;padding:6px 14px 6px 8px;text-align:left}
.rw .ok{width:22px;height:22px;border-radius:50%;background:var(--cat);display:grid;place-items:center;font-size:12px;color:#fff;flex:none}

function checkAch(){ACH.forEach(a=>{if(!S.ach[a.id]&&a.test()){S.ach[a.id]=true;addCash(a.reward);sfx.day();burst(325,P.x,P.y-130,6);achPop(a);}})}
let achQ=[];function achPop(a){achQ.push(a);if(achQ.length===1)showAch()}
function showAch(){const a=achQ[0];if(!a)return;toast('🏅 '+a.name+' · +'+a.reward+'k','ok');setTimeout(()=>{achQ.shift();showAch()},2800)}
function setPose(p,t){P.pose=p;P.poseT=t}
function bumpRep(d){S.rep=clamp(S.rep+d,0,5)}

function pickWeighted(arr,wf){const tot=arr.reduce((a,x)=>a+wf(x),0);let r=Math.random()*tot;for(const x of arr){r-=wf(x);if(r<=0)return x}return arr[arr.length-1]}
const slotN=()=>Math.min(5,3+(S.owned.xe?1:0)+(typeof cartLvN==='function'&&cartLvN()>=3?1:0));
const SLOT=[[-105,0],[105,0],[-215,8],[215,8],[-325,14]];
const QMAX=6;
const queueN=()=>{let n=0;for(const c of cust)if(c.state==='come'&&c.slot<0&&c.inq)n++;return n};
const queueList=()=>cust.filter(c=>c.state==='come'&&c.slot<0&&c.inq).sort((a,b)=>a.qt-b.qt);
const qPos=i=>({x:P.x+(i%2?1:-1)*(330+Math.floor(i/2)*64),y:LANE+38+(i%3)*7});
const slotPos=i=>({x:P.x+SLOT[i][0],y:LANE+32+SLOT[i][1]});
function spawnCustomer(){const so=spotAt();const avail=unlockedItems();const d=districtAt(P.x);
  const arch=pickWeighted(ARCH.filter(a=>!a.dist||a.dist===d.id),a=>a.w*(a.dist?3:1)*(isHoliday()&&(a.id==='tay'||a.id==='giadinh')?3:1));
  const heat=isHot()?{nuocmia:3,kemchuoi:3,dua:2,nuocngot:2,che:2,sinhto:2}:{};
  const want=pickWeighted(avail,i=>(1+(so?(so.s.like[i.id]||0)*1.5:0)+(arch.like[i.id]||0)*1.2+(heat[i.id]||0))*evWant(i)*(S.dem[i.id]||1));
  const id=pick(arch.kinds);const name=`${arch.title} ${pick(FIRST)}${arch.label?' '+arch.label:''}`;
  const side=Math.random()<.5?-1:1;
  const base={state:'come',want,slot:-1,pat:0,arch,name,qty:arch.qty,hold:null,t:0,mood:null,sp:arch.id==='grab'?260:rnd(120,160),qt:S.t,inq:false};
  cust.push({...base,id,x:P.x+side*(VW*.55+rnd(30,160)),y:rnd(392,436),ph:rnd(0,9),face:-side});
  // group of friends: arrive together, order the same, bonus for serving them fast
  if(!arch.dist&&arch.qty<2&&cust.length<6&&S.rep>=1.5&&Math.random()<.16){const g=++S.grpN||(S.grpN=1),n=1+(Math.random()<.4?1:0);cust[cust.length-1].grp=g;for(let k=1;k<=n;k++)cust.push({...base,id:pick(arch.kinds),x:P.x+side*(VW*.55+rnd(30,160)+k*46),y:rnd(392,436),ph:rnd(0,9),face:-side,grp:g,qt:S.t+k*.01})}}
function freeSlot(){for(let i=0;i<slotN();i++)if(!cust.some(c=>c.slot===i))return i;return -1}
function comboBonus(){return 1+Math.min(.5,Math.max(0,S.combo-1)*.06)}
function breakCombo(){if(S.combo>=3)toast('Đứt combo ×'+S.combo+' 😢');S.combo=0;S.comboT=0}
function serve(c){if(c.state!=='wait')return;let grpB=0;if(c.grp){if(S.lastGrp&&S.lastGrp.g===c.grp&&S.t-S.lastGrp.t<6)grpB=3;S.lastGrp={g:c.grp,t:S.t}}const it=c.want,so=spotAt();const fast=c.pat/(patMax()*c.arch.pat)>.62;
  if(S.stock[it.id]>0){S.combo=(S.comboT>0?S.combo:0)+1;S.comboT=6.5;S.bestCombo=Math.max(S.bestCombo||0,S.combo);
  const mult=(so?so.s.d.mult:1)*c.arch.pay*(1+S.stats.buon*.05)*(isHoliday()?1.3:1)*comboBonus()*(fast?1.12:1);const price=Math.round(itemPrice(it)*mult);
  comboFx();const stars=satisfy(c,fast,so);weeklyProg(c,price,stars);S.stock[it.id]--;S.dayCost=(S.dayCost||0)+it.cost;addCash(price+grpB);if(grpB)setTimeout(()=>fly(c.x,c.y-chH(c.id)-90,'👥 Cả nhóm +'+grpB+'k','good'),300);S.daySold++;S.dayRev+=price;S.sold[it.id]++;S.totalSold++;S.archSold[c.arch.id]=(S.archSold[c.arch.id]||0)+1;gainXp(3+Math.round(price/10)+(stars>=5?2:0));
    fly(c.x,c.y-chH(c.id)-30,'+'+price+'k'+(c.arch.pay>=2?' 💸':'')+(fast?' ⚡':''),'good');sfx.sale();if(S.combo>=2)setTimeout(()=>beep(660+Math.min(S.combo,10)*70,.09,'triangle',.05),120);questProgress(c,so);goalCheck();checkAch();
    flyCoin(c.x,c.y-chH(c.id)-10);burst(168,c.x,c.y-chH(c.id)-20,2,{sp:60,up:120,g:-60,s:22});P.hopT=.3;
    if(price>=45)setPose('happy',.9);
    if(Math.random()<.45)setTimeout(()=>say(c.x,c.y-chH(c.id)-60,(c.arch.id==='tay'?QUOTES.tay:QUOTES.buy)[Math.floor(Math.random()*5)]),350);
    c.qty--;if(c.qty>0&&S.stock[it.id]>0){c.pat=Math.min(patMax(),c.pat+2);fly(c.x,c.y-chH(c.id)-70,'“Cho thêm phần nữa!”','good');ui();return}
    c.hold=it.ic;leave(c,'happy')}
  else{breakCombo();fly(c.x,c.y-chH(c.id)-30,'Hết '+it.name.toLowerCase()+' rồi!','bad');S.dayLost++;sfx.bad();burst(0,c.x,c.y-chH(c.id)-10,1,{up:60,g:-30,s:34,life:1.2});leave(c,'sad');bumpRep(-.15);setPose('sad',.9)}ui()}
function flyCoin(x,y){fx.push({k:'coin',x,y,t:0,x0:x,y0:y})}
function questProgress(c,so){S.quests.forEach(q=>{if(q.done)return;if(q.t==='sellN'&&c.want.id===q.item)q.p=(q.p||0)+1;if(q.t==='sellAt'&&so&&so.s.id===q.spot)q.p=(q.p||0)+1;if(q.t==='rev')q.p=S.dayRev;if(q.t==='arch'&&c.arch.id===q.arch)q.p=(q.p||0)+1;

function goalCheck(){if(S.goalHit||S.dayRev<S.goal)return;S.goalHit=true;const b=Math.round(S.goal*.25);addCash(b);sfx.day();burst(325,P.x,P.y-130,8,{sp:240,up:300});burst(168,P.x,P.y-120,6,{sp:200,up:260});const f=$('flash');f.textContent='🎯 ĐẠT CHỈ TIÊU +'+b+'k';f.classList.remove('on');void f.offsetWidth;f.classList.add('on');S.log.push('Đạt chỉ tiêu ngày +'+b+'k')}

  const so=spotAt();if(so&&(so.s.market||so.s.cafe||so.s.home)){toast('Chỗ này không bày hàng được');return}
  S.open=true;spawnT=.6;sfx.tap();const cp=compAt();toast(cp?`${cp.name} đang bán ở đây, khách chia đôi. Cạnh tranh hay đi chỗ khác?`:so?`Bày hàng ở ${so.s.emoji} ${so.s.name}${isPeak(so.s)?' — đang giờ đông!':''}${so.s.risk>=.8?' ⚠️ công an hay tuần':''}`:'Chỗ này vắng, tới điểm có tên sẽ đông hơn');
  cry(pick(['Bánh mì nóng giòn đây!','Ai ăn gì không?','Mua giùm em nha!','Nước mía mát lạnh đây!']));
  if(S.day>=2&&!S.thugToday&&Math.random()<.22)setTimeout(()=>{if(S.open&&!thug)spawnThug()},4000+Math.random()*8000);actBtn()}
let spawnT=2;
function compAt(){const so=spotAt();if(!so)return null;return S.comps.find(c=>c.spot===so.s.id)||null}
function placeCompetitors(){compObjs=[];S.comps=[];
  const cands=SPOTS.filter(s=>S.unlocked.includes(s.d.id)&&!s.market&&!s.cafe&&!s.home&&!S.premises[s.id]);
  const n=Math.min(2+Math.floor(S.day/2),5,cands.length);const used=[];
  for(let i=0;i<n;i++){let s;do{s=pick(cands)}while(used.includes(s));used.push(s);const c=COMPETITORS[(i+S.day)%COMPETITORS.length];S.comps.push({spot:s.id,name:c.name});compObjs.push({s,c,ph:Math.random()*9})}}

function spawnWalker(){const lo=camera.x-VW*.6,hi=camera.x+VW*1.6;const x=clamp(rnd(lo,hi),60,WORLD-60);if(x>camera.x-80&&x<camera.x+VW+80&&walkers.length>2)return;
  walkers.push({id:pick(WALKERS2),x,y:rnd(380,440),dir:Math.random()<.5?-1:1,sp:rnd(34,70),ph:rnd(0,9),name:pick(WALK_NAMES),pause:0})}
function walkerTick(dt){if(walkers.length<4&&Math.random()<dt*.8)spawnWalker();
  for(let i=walkers.length-1;i>=0;i--){const w=walkers[i];if(w.x<camera.x-VW*1.4||w.x>camera.x+VW*2.6){walkers.splice(i,1);continue}
    if(w.pause>0){w.pause-=dt;continue}if(Math.random()<dt*.15){w.pause=rnd(1,3.5);if(Math.random()<.4)w.dir*=-1}
    w.x+=w.dir*w.sp*dt;if(w.x<80||w.x>maxX()+400)w.dir*=-1}}

    <div class="m">${locked?'🔒 Có khi tiền đạt '+fmt(i.unlock):`nhập ${i.cost}k → bán <b>${i.price}k</b>${i.perish&&!fresh()?' · dễ hỏng':''}`}</div>
    <div class="q"><button class="sm" data-d="-5" ${locked?'disabled':''}>−5</button><b>${S.stock[i.id]}</b><button class="sm" data-d="5" ${locked?'disabled':''}>+5</button></div></div>`}).join('');
  const ups=UPG.map(u=>`<div class="card ${S.owned[u.id]?'owned':''}"><div class="n"><span>${u.emoji}</span>${u.name}</div><div class="m">${u.desc}</div><div class="q">${S.owned[u.id]?'<b style="font-size:15px">✔ Đã có</b>':`<button class="sm gold up" data-id="${u.id}" style="flex:1" ${S.cash<u.cost?'disabled':''}>Mua · ${u.cost}k</button>`}</div></div>`).join('');
  const invest=ITEMS.reduce((a,i)=>a+S.stock[i.id]*i.cost,0);
  sheet.innerHTML=`<h1>${mid?'Ghé chợ nhập thêm':'Chợ đầu mối'}</h1><p>${mid?'Giữa ngày, nhập nhanh rồi chạy tiếp.':'Nhập hàng cho ngày '+S.day+'. Quận xa bán được giá cao hơn (Q3 ×1.3, Q5 ×1.6).'}</p>
  <div class="tabs"><button id="tHang" class="${tab==='hang'?'on':''}">🧺 Hàng</button><button id="tUp" class="${tab==='up'?'on':''}">⚡ Nâng cấp</button><button id="tNv" class="${tab==='nv'?'on':''}">👩‍🍳 Nhân viên</button></div>
  ${tab==='nv'?`<div class="card ${S.helper?'owned':''}"><div class="n"><span>👩‍🍳</span>Phụ xe Út Mén</div><div class="m">Đi theo xe, cứ 3 giây tự bán cho 1 khách đang đợi. Lương 60k/ngày trừ cuối ngày. Có thêm 1 tay là khỏi sợ giờ cao điểm.</div><div class="q"><button class="sm ${S.helper?'':'gold'}" id="hire" style="flex:1">${S.helper?'Cho nghỉ':'Thuê · 60k/ngày'}</button></div></div>`:`<div class="grid">${tab==='hang'?rows:ups}</div>`}
  <div class="total"><div><small>Tiền còn</small><span id="pc">${fmt(S.cash)}</span></div><div style="text-align:right"><small>Hàng trên xe</small><span>${invest}k</span></div></div>
  <button class="pri" id="go">${mid?'Chạy tiếp ☀️':'Ra phố bán ☀️'}</button>`;
  $('tHang').onclick=()=>{tab='hang';sfx.tap();showMarket(mid)};$('tUp').onclick=()=>{tab='up';sfx.tap();showMarket(mid)};$('tNv').onclick=()=>{tab='nv';sfx.tap();showMarket(mid)};
  const hr=$('hire');if(hr)hr.onclick=()=>{S.helper=!S.helper;sfx.sale();save();toast(S.helper?'Út Mén: "Dạ chị, em phụ liền!"':'Út Mén nghỉ rồi');showMarket(mid)};
  sheet.querySelectorAll('.card[data-id] .sm').forEach(b=>b.onclick=()=>{const id=b.closest('.card').dataset.id,it=ITEMS.find(i=>i.id===id),d=+b.dataset.d;
    if(d>0){if(S.cash<it.cost*5){toast('Không đủ tiền');sfx.bad();return}S.cash-=it.cost*5;S.stock[id]+=5}else{if(S.stock[id]<5)return;S.stock[id]-=5;S.cash+=it.cost*5}sfx.tap();showMarket(mid)});
  sheet.querySelectorAll('.up').forEach(b=>b.onclick=()=>{const u=UPG.find(x=>x.id===b.dataset.id);S.cash-=u.cost;S.owned[u.id]=true;toast(u.emoji+' Đã mua '+u.name);sfx.sale();save();showMarket(mid)});
  $('go').onclick=()=>{if(!mid&&ITEMS.every(i=>S.stock[i.id]===0)){toast('Nhập ít hàng đã chứ!');sfx.bad();return}if(mid){closeSheet();sfx.tap()}else startDay()};ui()}

  sheet.innerHTML=`<h1>📒 Sổ tay</h1>
  <div class="stats"><div class="stat"><small>Mặt bằng đã mua</small><b>${own}/3</b></div><div class="stat"><small>Mục tiêu tiền</small><b>${fmt(S.cash)} / ${fmt(GOAL_CASH)}</b></div></div>
  <div class="tabs"><button id="nS" class="${tab==='s'?'on':''}">🧑 Nhân vật</button><button id="nQ" class="${tab==='q'?'on':''}">🗺️ Quận</button><button id="nP" class="${tab==='p'?'on':''}">🏪 Mặt bằng</button><button id="nZ" class="${tab==='z'?'on':''}">📍 Điểm bán</button><button id="nT" class="${tab==='t'?'on':''}">📋 Nhiệm vụ</button><button id="nA" class="${tab==='a'?'on':''}">🏅 Thành tựu</button><button id="nB" class="${tab==='b'?'on':''}">🏦 Ngân hàng</button></div>
  ${tab==='s'?`<div class="stats"><div class="stat"><small>Cấp ${S.level} · ${title()}</small><b>${S.xp}/${xpNeed()} XP</b><div class="bar" style="width:100%"><i style="width:${S.xp/xpNeed()*100}%"></i></div></div><div class="stat"><small>Điểm chưa cộng</small><b class="${S.statPts?'good':''}">${S.statPts}</b></div></div>
   <div class="grid">${STATS.map(st=>`<div class="card"><div class="n"><span>${st.emoji}</span>${st.name} <b style="margin-left:auto">${S.stats[st.id]}</b></div><div class="m">${st.desc}</div><div class="q"><button class="sm gold st" data-id="${st.id}" style="flex:1" ${S.statPts?'':'disabled'}>+1</button></div></div>`).join('')}</div>
   <p style="margin-top:10px">Bán hàng có XP. Lên cấp được 1 điểm. Danh hiệu: ${TITLES.map(t=>t[1]).join(' → ')}.</p>`
  :tab==='a'?`<div class="zones">${ACH.map(a=>`<div class="zone" style="${S.ach[a.id]?'':'opacity:.6'}"><b>${S.ach[a.id]?'🏅':'⬜'} ${a.name}</b>${a.desc} · +${a.reward}k</div>`).join('')}</div>`
  :tab==='b'?`<div class="stats"><div class="stat"><small>Đang nợ</small><b class="${S.loan?'bad':''}">${S.loan}k</b></div><div class="stat"><small>Lãi</small><b>5%/ngày</b></div></div><p>Vay nóng vốn để nhập hàng hay mua mặt bằng. Lãi cộng dồn mỗi tối, nợ lâu là chết chìm. Tối đa 800k.</p>
   <div class="row" style="margin-top:0"><button class="blue" id="loan1" ${S.loan>=800?'disabled':''}>Vay 200k</button><button class="blue" id="loan2" ${S.loan>=800?'disabled':''}>Vay 500k</button><button class="gold" id="payL" ${S.loan&&S.cash>=Math.min(S.loan,200)?'':'disabled'}>Trả ${Math.min(S.loan,200)||0}k</button></div>`
  :tab==='q'?`<div class="grid">${dists}</div>`:tab==='p'?`<div class="grid">${prem}</div>`:tab==='t'?`<div class="zones">${S.quests.map(q=>`<div class="zone"><b>${q.done?'✅':'⬜'} ${q.txt}</b>${q.done?'Đã nhận '+q.reward+'k':(q.p||0)+'/'+q.n+' · thưởng '+q.reward+'k'}</div>`).join('')||'<div class="zone">Sáng mai có nhiệm vụ mới.</div>'}${S.comps.map(c=>{const s=SPOTS.find(x=>x.id===c.spot);return `<div class="zone"><b>🏪 ${c.name}</b>đang bán ở ${s.emoji} ${s.name}</div>`}).join('')}</div>
  <div class="row" style="margin-top:6px"><input id="cn" value="${S.cartName.replace(/"/g,'&quot;')}" maxlength="24" style="flex:1;font:inherit;font-weight:700;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;background:var(--paper-2);color:var(--ink);min-width:0"><button class="sm gold" id="cnSave">Đặt tên quầy</button></div>`:`<div class="zones">${zones}</div>`}
  <div class="row">${S.owned.xemay?'<button class="blue" id="goCho">🛵 Về chợ nhanh</button>':''}<button class="pri" id="out">Đóng</button></div>

$('menuBtn').onclick=()=>{if(S.phase!=='play')return;sfx.tap();tab=S.statPts?'s':'q';sheet.hidden?showNotebook():closeSheet()};
function showIntro(hasSave){sheet.hidden=false;sheet.innerHTML=`<img src="logo.png" alt="Vỉa Hè Sài Gòn" style="width:min(70vw,360px);display:block;margin:-4px auto 6px">

// ================= SAVE =================
function save(){try{const o={};['cash','day','rep','stock','owned','outfit','outfits','premises','unlocked','house','history','cartName','dodges','level','xp','stats','statPts','helper','loan','ach','totalSold','archSold','copEscapes','lottoWins'].forEach(k=>o[k]=S[k]);localStorage.setItem('vhsg-2d-v1',JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('vhsg-2d-v1'));if(!o||!o.day)return false;Object.assign(S,o);if(!OUTFITS.some(x=>x.id===S.outfit))S.outfit='287';S.outfits=(S.outfits||[]).filter(id=>OUTFITS.some(x=>x.id===id));if(!S.outfits.includes('287'))S.outfits.push('287');ITEMS.forEach(i=>{if(S.stock[i.id]==null)S.stock[i.id]=0});return true}catch(e){return false}}

// ================= UI =================
function ui(){$('cash').textContent=fmt(S.cash);$('dayN').textContent=S.day;$('lv').textContent=REPN[repI()];const r=Math.round(S.rep);$('rep').textContent='★'.repeat(r)+'☆'.repeat(5-r);{const g=$('goalB');g.style.width=Math.min(100,(S.dayRev||0)/(S.goal||1)*100)+'%';$('goalT').textContent=(S.dayRev||0)+'/'+(S.goal||0)+'k';$('hud').querySelector('.goal').classList.toggle('done',!!S.goalHit)}$('staB').style.width=(S.sta/staMax()*100)+'%';$('staB').style.background=S.sta<20?'var(--bad)':'var(--blue)';
  $('tray').innerHTML=unlockedItems().filter(i=>S.stock[i.id]>0).map(i=>`<div class="tr ${S.stock[i.id]<=3?'low':''}">${itemIc(i)}<b>${S.stock[i.id]}</b></div>`).join('');const pc=$('pc');if(pc)pc.textContent=fmt(S.cash)}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function clock(){const h=hour(),hh=Math.floor(h),mm=Math.floor((h-hh)*60);$('clock').textContent=(weather.rain?'🌧️':h<11?'☀️':h<16?'🌤️':'🌇')+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}// ================= SYS v4: economy · satisfaction · events · missions · map · settings · audio · debug =================
const SAVE_VERSION=6,SAVE_KEY='vhsg-2d-v1',SET_KEY='vhsg-settings';
const vnd=k=>(Math.round(k*10)/10*1000).toLocaleString('vi-VN')+'₫';
// ---------- settings ----------
const SET=Object.assign({master:.8,music:.45,sfx:.8,amb:.6,reduce:false,contrast:false,fps:false,hints:true},(()=>{try{return JSON.parse(localStorage.getItem(SET_KEY))||{}}catch(e){return {}}})());

  if(na>.1||weather.a>.4){const a=Math.max(na,weather.a*.6);ctx.save();ctx.globalCompositeOperation='lighter';DECOR.forEach(d=>{if(d.k!=='lamp'||d.x<camera.x-80||d.x>camera.x+VW+80)return;const gx=d.x-18,gy=382-d.h+16;const g=ctx.createRadialGradient(gx,gy,0,gx,gy,120);g.addColorStop(0,`rgba(255,200,110,${a*.75})`);g.addColorStop(1,'rgba(255,170,60,0)');ctx.fillStyle=g;ctx.fillRect(gx-120,gy-120,240,300)});ctx.restore()}}
const sf=f=>{try{f()}catch(e){ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(!window.__se){window.__se=1;console.error('draw part',e);try{const d=document.createElement('div');d.id='drawerr';d.style.cssText='position:fixed;left:6px;bottom:6px;z-index:999;background:rgba(0,0,0,.7);color:#fff;font:11px monospace;padding:4px 8px;border-radius:6px;max-width:70vw;pointer-events:none';d.textContent='draw: '+(f.name||'fn')+' · '+(e&&e.message);document.body.appendChild(d)}catch(_){}}}};
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#bfe3ff';ctx.fillRect(0,0,cv.width,cv.height);
  const k=timeK();cover(40,1);cover(43,sm(.5,.78,k));if(isHoliday()&&S.phase==='play')cover(79,sm(.84,.97,k));else cover(36,sm(.84,.98,k));cover(224,weather.a*.92);
  if(weather.flash>0){ctx.fillStyle=`rgba(255,255,255,${weather.flash*1.4})`;ctx.fillRect(0,0,cv.width,cv.height)}

  sf(()=>tiled(240,.28,BASE+16,170,.5,true));
  ctx.fillStyle='#d8ccb6';ctx.fillRect(0,VH-1,VW,2000);

  drawBubbles();

  drawFx();
  ctx.restore();
  drawAmbient();
}

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;try{dbgTick(dt)}catch(e){}
  if(S.phase==='play'){if(sheet.hidden){dayT+=dt;try{tick(dt)}catch(e){console.error('tick',e);if(!window.__te){window.__te=1;toast('⚠️ '+e.message)}}}else{traffic.forEach(v=>{v.x+=v.dir*v.sp*dt*.3})}clock();{const e=$('combo');if(S.comboT>0&&S.combo>=2){e.classList.add('on');$('cmT').style.width=(S.comboT/6.5*100)+'%'}else e.classList.remove('on')}uiT+=dt;if(uiT>.25){uiT=0;ui()}if(dayT>=DAY_LEN)endDay()}
  else{if(traffic.length<5&&Math.random()<dt*.8)spawnVeh();for(let i=traffic.length-1;i>=0;i--){const v=traffic[i];v.x+=v.dir*v.sp*dt*.4;if(Math.abs(v.x-(camera.x+VW/2))>VW+450)traffic.splice(i,1)}fx.forEach(f=>f.t+=dt);for(let i=fx.length-1;i>=0;i--)if(fx[i].t>2)fx.splice(i,1);camera.x=lerp(camera.x,clamp(P.x-VW/2,0,WORLD-VW),Math.min(1,dt*3));walkerTick(dt);weather.a=lerp(weather.a,0,dt)}
  try{draw()}catch(e){console.error('draw',e);window.__dfail=(window.__dfail||0)+1;try{cv.width=cv.width}catch(_){}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';if(!window.__de){window.__de=1;toast('⚠️ draw: '+e.message)}}
  requestAnimationFrame(frame)}

function cartPlate(cc,x,by,ch,io){const sw=ch*io.i.naturalWidth/io.i.naturalHeight,[fx,fy,fw,fh,txt]=cc.lab,cx=x+(fx-.5)*sw,cy=by-ch*(1-fy),w=fw*sw,h=fh*ch;
  ctx.save();ctx.translate(cx,cy);ctx.fillStyle='#8a4a1e';rr(-w/2,-h/2,w,h,h*.3);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#2a1a10';ctx.stroke();ctx.fillStyle='#ffe9a8';ctx.font='800 '+Math.round(Math.min(h*.62,w/Math.max(6,txt.length)*1.7))+'px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,1);ctx.restore()}

function steam(x,y){ctx.save();for(let i=0;i<3;i++){const k=(S.t*.7+i/3)%1;ctx.globalAlpha=(1-k)*.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+Math.sin(S.t*3+i*2)*3,y-k*22,2.5+k*3,0,7);ctx.fill()}ctx.restore()}

const AZ=['man_eating_pho','man_sitting_holding_coffee','man_sitting_reading_newspaper','woman_sitting_using_phone'];

  else{add(y,()=>{shadow(x,y,26);spr('z/woman_walking_carrying_grocery_bag',x,y-Math.abs(Math.sin(t*9+ph))*3,134,{flip:f<0,rot:Math.sin(t*9+ph)*.03})})}}

const QPOSE=['customer_checking_wristwatch_wai','customer_standing_with_crossed_arms','teenager_looking_at_phone'];
